apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    alloy:
      # Pod log collection, equivalent to the former promtail config:
      # same labels (namespace, pod, container, app, component, instance,
      # job, node_name, filename, stream) and the same pipeline stages.
      configMap:
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
              target_label  = "__tmp_controller_name"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                "__meta_kubernetes_pod_label_app",
                "__tmp_controller_name",
                "__meta_kubernetes_pod_name",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              target_label = "app"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
                "__meta_kubernetes_pod_label_instance",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              target_label = "instance"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_component",
                "__meta_kubernetes_pod_label_component",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              target_label = "component"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["namespace", "app"]
              separator     = "/"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_container_name",
              ]
              separator    = "/"
              regex        = "true/(.*)"
              replacement  = "/var/log/pods/*$1/*.log"
              target_label = "__path__"
            }
            // pod discovery emits one target per container port; drop the
            // port labels so each container's log file is tailed only once
            rule {
              action = "labeldrop"
              regex  = "__meta_kubernetes_pod_container_port_.*"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets       = local.file_match.pods.targets
            forward_to    = [loki.process.pods.receiver]
            tail_from_end = true
          }

          loki.process "pods" {
            forward_to = [loki.write.default.receiver]

            stage.cri {}

            stage.multiline {
              firstline     = "^\\d{4}-\\d{2}-\\d{2}"
              max_wait_time = "3s"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
            }
          }

      # read pod logs from the node
      mounts:
        varlog: true
        extra:
          - name: storage
            mountPath: /var/lib/alloy/data

      # keep file read positions across pod restarts
      storagePath: /var/lib/alloy/data

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    controller:
      type: daemonset
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        extra:
          - name: storage
            hostPath:
              path: /var/lib/alloy/data
              type: DirectoryOrCreate

    serviceMonitor:
      enabled: true
