apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-polr-adapter
  namespace: trivy-system
spec:
  interval: 30m
  dependsOn:
    - name: trivy-operator
  chart:
    spec:
      chart: trivy-operator-polr-adapter
      version: 0.11.5
      sourceRef:
        kind: HelmRepository
        name: trivy-operator-polr-adapter
        namespace: flux-system
  values:
    adapters:
      vulnerabilityReports:
        enabled: true
        timeout: 10
      clusterVulnerabilityReports:
        enabled: true
        timeout: 10
      configAuditReports:
        enabled: true
        timeout: 10
      exposedSecretReports:
        enabled: true
        timeout: 10
      rbacAssessmentReports:
        enabled: true
        timeout: 10
      infraAssessmentReports:
        enabled: true
        timeout: 10
      clusterInfraAssessmentReports:
        enabled: true
        timeout: 10
      complianceReports:
        enabled: true
        timeout: 10

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
