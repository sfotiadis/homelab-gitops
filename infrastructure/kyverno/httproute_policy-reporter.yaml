apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter-https
  namespace: kyverno
spec:
  parentRefs:
    - name: crulabs-gateway
      sectionName: websecure
      namespace: gateway-system
  hostnames:
    - reports.crulabs.intern
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: policy-reporter-ui
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter-http
  namespace: kyverno
spec:
  parentRefs:
    - name: crulabs-gateway
      sectionName: web
      namespace: gateway-system
  hostnames:
    - reports.crulabs.intern
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
