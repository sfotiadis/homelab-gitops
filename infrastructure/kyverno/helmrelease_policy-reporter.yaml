apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: kyverno
spec:
  interval: 30m
  dependsOn:
    - name: kyverno
  chart:
    spec:
      chart: policy-reporter
      version: 3.11.2
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: flux-system
  values:
    ui:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

    plugin:
      kyverno:
        enabled: true
      trivy:
        enabled: true
        cli:
          image:
            registry: ghcr.io
            repository: aquasecurity/trivy
            tag: 0.76.1
    
    monitoring:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
      grafana:
        namespace: kyverno
        dashboards:
          enabled: true 
          label: grafana_dashboard
        folder:
          annotation: grafana_folder
          name: Policy Reporter
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
