apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: harbor
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey-resources
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
      interval: 12h

  values:
    cluster:
      spec:
        replicas: 3

        persistence:
          size: 5Gi
          storageClassName: local-path

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        podDisruptionBudget:
          mode: Cluster

        users:
          - name: default
            enabled: true
            commands:
              allow:
                - "+@all"
            keys:
              readWrite:
                - "*"
            passwordSecret:
              name: valkey-users
              keys:
                - password

    metrics:
      podMonitor:
        enabled: true
