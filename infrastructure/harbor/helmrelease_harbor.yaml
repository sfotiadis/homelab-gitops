---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
  labels:
    toolkit.fluxcd.io/tenant: harbor
spec:
  interval: 30m
  dependsOn:
    - name: harbor-postgres
      namespace: harbor
    - name: valkey
      namespace: harbor
  chart:
    spec:
      chart: harbor
      version: "1.19.1"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  values:
    externalURL: https://harbor.crulabs.intern

    expose:
      type: route
      tls:
        enabled: false
      route:
        parentRefs:
          - name: crulabs-gateway
            sectionName: websecure
            namespace: gateway-system
            group: gateway.networking.k8s.io
            kind: Gateway
        hosts:
          - harbor.crulabs.intern
        filters: []

    internalTLS:
      enabled: false

    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        jobservice:
          jobLog:
            storageClass: local-path
            size: 2Gi
        trivy:
          storageClass: local-path
          size: 5Gi
      imageChartStorage:
        type: s3
        s3:
          region: us-east-1
          bucket: harbor-bucket
          regionendpoint: http://rook-ceph-rgw.rook-ceph.svc.cluster.local
          secure: false
          disableredirect: true

    database:
      type: external
      external:
        host: harbor-postgres-rw.harbor.svc.cluster.local
        port: "5432"
        username: app
        existingSecret: harbor-db-credentials
        coreDatabase: harbor
        sslmode: disable

    redis:
      type: external
      external:
        addr: valkey.harbor.svc.cluster.local:6379
        existingSecret: valkey-users

    trace:
      enabled: false

  valuesFrom:
    - kind: Secret
      name: harbor-bucket-claim
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: persistence.imageChartStorage.s3.accesskey
    - kind: Secret
      name: harbor-bucket-claim
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: persistence.imageChartStorage.s3.secretkey
