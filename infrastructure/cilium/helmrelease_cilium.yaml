apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    # Cilium is the cluster's CNI: never uninstall it because the
    # HelmRelease was removed from git
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  # rolling the agent DaemonSet across all nodes takes close to the 5m default
  timeout: 15m
  # adopt the existing release that was installed manually
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      # upgrade one minor version at a time (1.17 -> 1.18 -> 1.19 -> 1.20)
      # and read the upgrade notes + run the preflight check before each
      version: 1.20.5
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  # only the values that differ from the chart defaults; taken from the
  # manually installed release (rev 2, 2026-05-26)
  values:
    cluster:
      name: kubernetes

    ipam:
      mode: kubernetes

    kubeProxyReplacement: false
    routingMode: tunnel
    tunnelProtocol: vxlan

    operator:
      replicas: 1

    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
