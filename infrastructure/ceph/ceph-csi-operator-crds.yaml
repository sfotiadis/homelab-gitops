# infrastructure/ceph/ceph-csi-operator-crds.yaml
# Only the csi.ceph.io CRDs - no ceph-csi-operator, no CSI drivers.
# The rook operator (v1.21+) watches csi.ceph.io/ClientProfile unconditionally;
# without these CRDs it crash-loops on "timed out waiting for cache to be synced".
# Keep the tag in sync with the ceph-csi-operator subchart version of the rook-ceph chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ceph-csi-operator
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/ceph/ceph-csi-operator
  ref:
    tag: v1.1.0
  ignore: |
    /*
    !/config/
    /config/*
    !/config/crd/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ceph-csi-operator-crds
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: ceph-csi-operator
  path: ./config/crd
  # never delete these CRDs implicitly - the rook operator cannot start without them
  prune: false
  wait: true
