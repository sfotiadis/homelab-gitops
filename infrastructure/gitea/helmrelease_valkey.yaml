apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: gitea
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  values:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path

    auth:
      enabled: true
      usersExistingSecret: valkey-users
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: REDIS_PASSWORD

    replica:
      enabled: true
      # since chart 1.0 this count includes the master (was 2 replicas + master)
      replicas: 3

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      exporter:
        image:
          registry: ghcr.io
          repository: oliver006/redis_exporter
          tag: v1.88.0
